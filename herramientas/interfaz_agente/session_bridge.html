<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Bridge — Vuelamind</title>
<style>
  :root{
    color-scheme: light dark;
    /* Paleta cálida, del mismo aire que el cliente de Claude: crema en claro, carbón
       templado en oscuro, y un solo acento terracota. Oscuro por defecto; el bloque de
       abajo lo cambia si el SO está en claro. */
    --bg:#262624; --panel:#30302e; --line:#413f3c; --ink:#f4f3ee; --dim:#a3a097;
    --field:#212120; --hover:#3a3a37; --on:#3d3c39; --chip:#3a3a37;
    --accent:#c96442; --accent-ink:#ffffff;
    --user:#34332f; --asst:transparent; --err:#40251f;
    --danger:#e08b72; --danger-line:#7d4636;
    --ok:#7bb47b; --bad:#e0685a;
    --radio:14px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#faf9f5; --panel:#f2f0e8; --line:#e3e0d6; --ink:#1f1e1d; --dim:#7c7a72;
      --field:#ffffff; --hover:#eceadf; --on:#e6e3d6; --chip:#eceadf;
      --accent:#c96442; --accent-ink:#ffffff;
      --user:#f0eee6; --asst:transparent; --err:#f9ece8;
      --danger:#b0472b; --danger-line:#e3c3b7;
      --ok:#4f8a4f; --bad:#c0392b;
    }
  }
  /* ---- TEMA: blueprint (el original) ---- */
  :root[data-tema="blueprint"]{
    --bg:#1e1e1e; --panel:#262626; --line:#3a3a3a; --ink:#f0f0f0; --dim:#9b9b9b;
    --field:#181818; --hover:#2e2e2e; --on:#3a3a3c; --chip:#333333;
    --accent:#0a84ff; --accent-ink:#ffffff;
    --user:#2f4257; --asst:transparent; --err:#4a2320;
    --danger:#ff6b6b; --danger-line:#8a4032;
    --ok:#34c759; --bad:#ff453a;
  }
  /* ---- TEMA: magenta (paleta de marca, armonizada para leer sin cansar) ---- */
  :root[data-tema="magenta"]{
    --bg:#221b1f; --panel:#2c2328; --line:#443640; --ink:#f6eff3; --dim:#a99aa2;
    --field:#1b1418; --hover:#362a30; --on:#3b2c35; --chip:#382a32;
    --accent:#d4477f; --accent-ink:#ffffff;
    --user:#352730; --asst:transparent; --err:#43212b;
    --danger:#e8809c; --danger-line:#7d3a52;
    --ok:#6fb08a; --bad:#e0657f;
  }
  @media (prefers-color-scheme: light){
    :root[data-tema="blueprint"]{
      --bg:#ffffff; --panel:#f5f5f7; --line:#d9d9de; --ink:#1d1d1f; --dim:#6e6e73;
      --field:#ffffff; --hover:#ececf0; --on:#e3e3ea; --chip:#e8e8ed;
      --accent:#0071e3; --accent-ink:#ffffff;
      --user:#d3e5fb; --asst:transparent; --err:#fdeceb;
      --danger:#c0392b; --danger-line:#e6b3ac;
      --ok:#28a745; --bad:#d70015;
    }
    :root[data-tema="magenta"]{
      --bg:#fdf8fa; --panel:#f6ecf1; --line:#ecdbe3; --ink:#241b20; --dim:#7f6d76;
      --field:#ffffff; --hover:#f2e3ea; --on:#eedde5; --chip:#f2e3ea;
      --accent:#b4144f; --accent-ink:#ffffff;
      --user:#f6ecf1; --asst:transparent; --err:#fceaef;
      --danger:#a01540; --danger-line:#e8c2d0;
      --ok:#3f8a63; --bad:#c0264c;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
  header{display:flex;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em}
  header .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:0 0 auto}
  header .dot.ok{background:var(--ok)}header .dot.bad{background:var(--bad)}
  header input{background:var(--field);border:1px solid var(--line);color:var(--ink);
       padding:6px 8px;border-radius:7px;font:inherit;width:230px}
  header .sp{flex:1}
  button{background:var(--accent);color:var(--accent-ink);
       border:0;padding:7px 14px;border-radius:9px;font:inherit;font-weight:500;cursor:pointer;
       transition:filter .12s ease}
  button:hover:not(:disabled){filter:brightness(1.07)}
  input,textarea,select{accent-color:var(--accent)}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}
  main{flex:1;display:flex;min-height:0}
  aside{width:250px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  aside .list{flex:1;overflow:auto}
  aside .list{padding:8px}
  .sess{padding:9px 11px;margin-bottom:2px;border-radius:10px;cursor:pointer;
       display:flex;flex-direction:column;gap:2px;transition:background .12s ease}
  .sess:hover{background:var(--hover)}
  .sess.on{background:var(--on);box-shadow:inset 2px 0 0 var(--accent)}
  .sess .n{font-weight:500}.sess .s{font-size:11px;color:var(--dim);font-family:ui-monospace,monospace}
  /* Mientras la sesión trabaja, una luz recorre su nombre. Se ve de reojo, que es la
     diferencia con una palabra: no hay que leerla para enterarse. */
  @keyframes barrido{ from{background-position:200% 0} to{background-position:-200% 0} }
  .sess.trabajando .est{display:none}
  .sess.trabajando .n{
    background:linear-gradient(100deg, var(--ink) 38%, var(--accent) 50%, var(--ink) 62%);
    background-size:200% 100%;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    animation:barrido 1.9s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){
    /* Quien pidió menos movimiento no pierde la señal: la conserva sin barrido. */
    .sess.trabajando .n{animation:none;-webkit-text-fill-color:var(--accent);color:var(--accent)}
  }
  aside .new{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  aside .new input,aside .new textarea,aside .new select{background:var(--field);border:1px solid var(--line);color:var(--ink);
       padding:6px 8px;border-radius:7px;font:inherit}
  aside .new textarea{resize:vertical;min-height:44px}
  section{flex:1;display:flex;flex-direction:column;min-width:0}
  .chathead{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--bg)}
  .chathead .cur{font-weight:600}
  .chathead .sp{flex:1}
  /* Cerrar y borrar una sesión no puede ser el botón más llamativo de la pantalla. */
  button.danger{background:transparent;color:var(--danger);border:1px solid var(--danger-line)}
  button.danger:hover:not(:disabled){background:var(--err);filter:none}
  /* La columna se centra y se acota, como en el cliente: leer no es llenar la pantalla. */
  .log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:22px;line-height:1.65;
       padding:28px max(20px, calc((100% - 780px) / 2)) 40px}
  .msg{max-width:100%;white-space:pre-wrap;word-wrap:break-word}
  /* Tú vas en burbuja; el asistente va a página limpia. Ésa es la diferencia que más se nota. */
  .msg.user{align-self:flex-end;max-width:85%;background:var(--user);
       padding:11px 16px;border-radius:var(--radio)}
  .msg.asst{align-self:stretch;background:none;border:0;padding:0}
  .msg.err{align-self:stretch;background:var(--err);border:1px solid var(--danger-line);
       padding:11px 14px;border-radius:var(--radio)}
  .msg .who{font-size:11px;color:var(--dim);margin-bottom:6px;letter-spacing:.01em;font-weight:500}
  .msg.user .who{text-align:right}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .msg.stream{max-width:92%}
  .msg.stream .st-status{font-style:italic;color:var(--dim);animation:pulse 1.4s ease-in-out infinite}
  .msg.stream .st-steps{margin-top:6px;display:flex;flex-direction:column;gap:3px}
  .msg.stream .st-step{font-size:12px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,monospace;
       white-space:pre-wrap;word-break:break-word;border-left:2px solid var(--line);padding-left:10px}
  .msg.stream{align-self:stretch}
  .composer{display:flex;gap:8px;align-items:flex-end;background:var(--bg);border-top:0;
       padding:8px max(20px, calc((100% - 780px) / 2)) 20px}
  .composer textarea{flex:1;background:var(--field);border:1px solid var(--line);color:var(--ink);
       padding:12px 14px;border-radius:var(--radio);font:inherit;resize:none;min-height:52px;max-height:200px;
       box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .composer textarea:focus{outline:none;border-color:var(--accent)}
  .composer .attach{background:transparent;border:1px solid var(--line);color:var(--dim);
       padding:0 14px;height:52px;font-size:18px;line-height:1;border-radius:var(--radio)}
  .composer button{height:52px;border-radius:var(--radio)}
  .attachbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px max(20px, calc((100% - 780px) / 2)) 0}
  .attachbar:empty{display:none}
  .chip{display:flex;align-items:center;gap:4px;background:var(--chip);border:1px solid var(--line);
       border-radius:14px;padding:3px 4px 3px 10px;font-size:12px}
  .chip.bad{border-color:var(--danger-line);color:var(--danger)}
  .new .sug{font-size:11px;color:var(--dim);margin:-2px 0 2px}
  .new .sug button{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;cursor:pointer;
    background:var(--field);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink)}
  .new .sug button:hover{background:var(--hover)}
  .chip .x{cursor:pointer;color:var(--dim);border:0;background:none;font-size:15px;padding:0 4px;line-height:1}
  .log.drop{outline:2px dashed var(--accent);outline-offset:-8px}
  .empty{margin:auto;color:var(--dim);text-align:center;padding:20px}
  .hint{font-size:11px;color:var(--dim)}
  .hint-traido{align-self:center;font-size:12px;color:var(--dim);border:1px dashed var(--line);
       border-radius:10px;padding:4px 10px;margin-bottom:6px}
  header .tema{background:var(--field);border:1px solid var(--line);color:var(--dim);
       font:inherit;font-size:12px;padding:3px 6px;border-radius:8px;cursor:pointer}
  /* medidor de contexto + gasto del turno (en la cabecera del chat) */
  .usage{font-size:11px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,monospace;
       display:flex;align-items:center;gap:7px;white-space:nowrap}
  .usage:empty{display:none}
  .usage::before{content:"";width:54px;height:5px;border-radius:3px;background:var(--line);
       background-image:linear-gradient(var(--accent),var(--accent));
       background-repeat:no-repeat;background-size:var(--pct,0%) 100%}
  .usage.hot::before{background-image:linear-gradient(var(--bad),var(--bad))}
  /* autocompletar de skills / comandos "/" */
  .composer{position:relative}
  .ac{position:absolute;left:12px;right:12px;bottom:calc(100% + 4px);max-height:260px;overflow:auto;
       background:var(--panel);border:1px solid var(--line);border-radius:9px;
       box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:30}
  .ac .it{padding:6px 12px;cursor:pointer;font-family:ui-monospace,SFMono-Regular,monospace;
       font-size:13px;display:flex;align-items:center;gap:8px}
  .ac .it:hover,.ac .it.sel{background:var(--on)}
  .ac .it .tag{margin-left:auto;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
  /* markdown en las respuestas del asistente */
  .msg .md{white-space:normal}
  .msg .md>:first-child{margin-top:0}.msg .md>:last-child{margin-bottom:0}
  .msg .md p{margin:.5em 0}
  .msg .md strong{font-weight:700}.msg .md em{font-style:italic}
  .msg .md h1,.msg .md h2,.msg .md h3,.msg .md h4,.msg .md h5,.msg .md h6{margin:.7em 0 .35em;line-height:1.25;font-weight:600}
  .msg .md h1{font-size:1.35em}.msg .md h2{font-size:1.22em}.msg .md h3{font-size:1.1em}
  .msg .md h4,.msg .md h5,.msg .md h6{font-size:1em}
  .msg .md ul,.msg .md ol{margin:.4em 0;padding-left:1.4em}.msg .md li{margin:.15em 0}
  .msg .md code{background:var(--field);border:1px solid var(--line);border-radius:5px;padding:.1em .35em;
       font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
  .msg .md pre{background:var(--field);border:1px solid var(--line);border-radius:9px;padding:10px 12px;overflow:auto;margin:.5em 0}
  .msg .md pre code{background:none;border:0;padding:0;font-size:.9em;white-space:pre}
  .msg .md blockquote{margin:.5em 0;padding:.2em .9em;border-left:3px solid var(--accent);color:var(--dim)}
  .msg .md a{color:var(--accent)}
  .msg .md hr{border:0;border-top:1px solid var(--line);margin:.8em 0}
  .msg .md table{border-collapse:collapse;margin:.5em 0;font-size:.95em;display:block;overflow:auto}
  .msg .md th,.msg .md td{border:1px solid var(--line);padding:5px 9px;text-align:left}
  .msg .md th{background:var(--hover);font-weight:600}
  /* botones de copiar */
  .msg .who{display:flex;align-items:center;gap:8px}
  .copy{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--dim);
       border-radius:6px;padding:1px 8px;font-size:11px;line-height:1.7;cursor:pointer;
       text-transform:none;font-weight:500;letter-spacing:0}
  .copy:hover{color:var(--ink);border-color:var(--dim)}
  .copy.ok{color:var(--ok);border-color:var(--ok)}
  .msg .md pre{position:relative}
  .msg .md pre .copy{position:absolute;top:6px;right:6px;margin:0;background:var(--panel);opacity:0;transition:opacity .12s}
  .msg .md pre:hover .copy{opacity:1}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Session Bridge · Vuelamind</h1>
  <span class="sp"></span>
  <select id="tema" class="tema" title="Tema de color — se recuerda en esta máquina">
    <option value="claude">Claude</option>
    <option value="magenta">Magenta</option>
    <option value="blueprint">Blueprint</option>
  </select>
  <span class="hint">solo loopback · sin token</span>
</header>
<main>
  <aside>
    <div class="list" id="list"></div>
    <div class="new">
      <div class="hint">Nueva sesión</div>
      <input id="newName" placeholder="nombre (a-z0-9._-)">
      <textarea id="newPrompt" placeholder="primer mensaje…"></textarea>
      <div class="sug">sugerencia: <button type="button" id="sugLoad"
        title="Pone al día al asistente antes de empezar: lee el arranque del dominio, corre su validador y reporta el estado">/vuelamind-load</button></div>
      <select id="newPerm" title="Nivel de permisos de la sesión">
        <option value="full">Autonomía total (ejecuta / red / escribe)</option>
        <option value="tools">Python + red acotada</option>
        <option value="safe">Solo lectura / chat</option>
      </select>
      <input id="newModel" list="modelosSugeridos" autocomplete="off"
             placeholder="Modelo por defecto del servidor"
             title="Modelo (vacío = el que use el servidor). Se puede teclear cualquier id, p.ej. claude-opus-4-8[1m] para la ventana de 1M">
      <datalist id="modelosSugeridos">
        <option value="claude-opus-4-8">
        <option value="claude-opus-4-8[1m]">
        <option value="claude-opus-5">
        <option value="claude-sonnet-5">
        <option value="claude-haiku-4-5-20251001">
      </datalist>
      <button id="create">Crear sesión</button>
    </div>
  </aside>
  <section>
    <div class="chathead" id="chathead" style="display:none">
      <span class="cur" id="curname"></span>
      <span class="usage" id="usage" title="contexto usado · tokens generados en el último turno"></span>
      <span class="sp"></span>
      <button id="close" class="ghost danger" title="Detiene la sesión y la quita de esta página">Cerrar este chat</button>
    </div>
    <div class="log" id="log"><div class="empty">Elige o crea una sesión.</div></div>
    <div class="attachbar" id="attachbar"></div>
    <div class="composer">
      <div class="ac" id="ac" hidden></div>
      <input type="file" id="file" multiple hidden>
      <button id="attach" class="ghost attach" title="Adjuntar archivo(s) de texto — o pega / arrastra al chat" disabled>📎</button>
      <textarea id="input" placeholder="Escribe un mensaje…  (Enter envía · Shift+Enter salto · 📎 pega o arrastra texto/imágenes/PDF)" disabled></textarea>
      <button id="send" disabled>Enviar</button>
    </div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const state = { current: null, usage: {}, commands: [], skills: [], streams: {}, traido: {} };
// streams: los turnos EN VUELO, por nombre de sesión. Un turno pertenece a la sesión
// que lo pidió, no a la que estés mirando cuando termine — ver el comentario de send().

// ---- tema de color: los tres viven en CSS; esto solo pone el atributo y lo recuerda ----
const TEMAS=["claude","magenta","blueprint"];
function aplicarTema(t){
  if(!TEMAS.includes(t)) t="claude";
  document.documentElement.setAttribute("data-tema", t);
  try{ localStorage.setItem("tema", t); }catch{}
  const s=$("#tema"); if(s) s.value=t;
}
aplicarTema((()=>{ try{ return localStorage.getItem("tema")||"claude"; }catch{ return "claude"; } })());

function hdrs(){ return { "Content-Type":"application/json" }; }
function setDot(ok){ $("#dot").className = "dot " + (ok?"ok":"bad"); }

// ---- medidor de contexto + gasto del turno ----
function fmtTok(n){ n=+n||0; return n>=1000 ? (n/1000).toFixed(n<10000?1:0)+"k" : ""+n; }
function usageText(u){
  if(!u) return "";
  const pct = u.window ? Math.round(100*u.context_tokens/u.window) : null;
  const ctx = fmtTok(u.context_tokens)+(u.window?"/"+fmtTok(u.window):"");
  // El primer turno de una sesión nueva no sabe todavía la ventana real del modelo: usa el
  // valor por omisión. Se marca con ~ en vez de presentarlo como un dato medido — un número
  // supuesto con la misma cara que uno medido es el defecto que este arreglo vino a quitar.
  const aprox = u.provisional ? "~" : "";
  return (pct!=null?"🧠 "+aprox+pct+"% · ":"")+aprox+ctx+" · ↑"+fmtTok(u.output_tokens)+" tok";
}
function renderUsage(name){
  const el=$("#usage"), u=state.usage[name];
  el.textContent=usageText(u);
  const pct=(u&&u.window)?Math.min(100,Math.round(100*u.context_tokens/u.window)):0;
  el.style.setProperty("--pct",pct+"%");
  el.classList.toggle("hot", pct>=80);
}
function saveUsage(name,u){ try{ localStorage.setItem("usage:"+name,JSON.stringify(u)); }catch{} }
function loadUsage(name){ try{ return JSON.parse(localStorage.getItem("usage:"+name))||null }catch{ return null } }

// ---- autocompletar de skills / comandos "/" (lista que llega en el init) ----
function saveCommands(cmds, skills){
  if(Array.isArray(cmds)&&cmds.length){
    state.commands=cmds;
    state.skills=Array.isArray(skills)?skills:[];
    try{ localStorage.setItem("bridge:commands",JSON.stringify(cmds));
         localStorage.setItem("bridge:skills",JSON.stringify(state.skills)); }catch{}
  }
}
try{ state.commands=JSON.parse(localStorage.getItem("bridge:commands"))||[];
     state.skills=JSON.parse(localStorage.getItem("bridge:skills"))||[]; }catch{}

// transcript local por sesión (la API no guarda historial completo)
function tx(name){ try{return JSON.parse(localStorage.getItem("tx:"+name))||[]}catch{return[]} }
function pushTx(name,role,text){ const t=tx(name); t.push({role,text}); localStorage.setItem("tx:"+name,JSON.stringify(t)); }

// ---- adjuntos: texto/código (embebido), imágenes y PDF (base64, bloque nativo) ----
// atts: {name, ok, reason, kind:"text"|"media", text?, media_type?, data?}
const atts = [];
const MAX_TEXT = 512*1024, MAX_IMG = 5*1024*1024, MAX_PDF = 20*1024*1024;
const IMG_TYPES = ["image/png","image/jpeg","image/gif","image/webp"];
const TEXT_EXT = /\.(txt|md|markdown|mdx|rst|json|jsonl|ndjson|csv|tsv|log|ya?ml|toml|ini|conf|cfg|env|properties|xml|html?|css|scss|sass|less|js|mjs|cjs|jsx|ts|tsx|py|rb|go|rs|java|kt|kts|scala|c|h|cc|cpp|hpp|hh|m|mm|cs|php|swift|dart|lua|pl|r|sh|bash|zsh|fish|ps1|bat|sql|graphql|gql|proto|tf|hcl|dockerfile|makefile|gitignore|gitattributes|editorconfig)$/i;
function isImage(f){ const t=(f.type||"").toLowerCase(); return t.startsWith("image/") && t!=="image/svg+xml"; }
function isPdf(f){ return (f.type||"").toLowerCase()==="application/pdf" || /\.pdf$/i.test(f.name||""); }
// Los formatos de Office son ZIP con XML dentro, y su tipo MIME lleva la palabra
// "openxmlformats" — que contiene "xml". Sin esta guarda, isText() los daba por texto y
// readAsText() leía el ZIP: al modelo le llegaba un galimatías CON NOMBRE DE DOCUMENTO,
// sin error y sin aviso. Solo fallaba en voz alta si pasaba de 512 KB, y entonces mentía
// diciendo "texto muy grande". MEDIDO con un .docx real.
const OFFICE_EXT = /\.(docx?|xlsx?|pptx?|odt|ods|odp|pages|numbers|key|rtf)$/i;
function isOffice(f){
  const n=(f.name||"").toLowerCase(), t=(f.type||"").toLowerCase();
  return OFFICE_EXT.test(n) || t.includes("officedocument") || t.includes("opendocument")
         || t.includes("msword") || t.includes("ms-excel") || t.includes("ms-powerpoint");
}
function isText(f){
  const n=(f.name||"").toLowerCase(), t=(f.type||"").toLowerCase();
  if(isOffice(f)) return false;              // antes que nada: un ZIP no es texto
  if(t.startsWith("text/")) return true;
  if(/(json|xml|javascript|ecmascript|csv|yaml|x-sh|x-python|svg)/.test(t)) return true;
  if(TEXT_EXT.test(n) || /(^|\/)(dockerfile|makefile)$/.test(n)) return true;
  if(t==="" && f.size<=MAX_TEXT) return true;   // sin tipo → intentamos como texto
  return false;
}
function renderAtts(){
  const bar=$("#attachbar"); bar.innerHTML="";
  atts.forEach((a,i)=>{
    const c=document.createElement("div"); c.className="chip"+(a.ok?"":" bad");
    const icon=!a.ok?"⚠️":a.kind==="media"?(a.media_type==="application/pdf"?"📕":"🖼️"):"📄";
    const s=document.createElement("span");
    s.textContent=icon+" "+a.name+(a.ok?"":" — "+a.reason);
    const x=document.createElement("button"); x.className="x"; x.textContent="×"; x.title="quitar";
    x.onclick=()=>{ atts.splice(i,1); renderAtts(); };
    c.appendChild(s); c.appendChild(x); bar.appendChild(c);
  });
}
function readB64(f,cb){ const r=new FileReader(); r.onload=()=>cb(String(r.result).split(",")[1]||""); r.onerror=()=>cb(null); r.readAsDataURL(f); }
function addFiles(files){
  [...files].forEach(f=>{
    const push=(o)=>{ atts.push(o); renderAtts(); };
    if(isImage(f)){
      if(f.size>MAX_IMG) return push({name:f.name,ok:false,reason:"imagen muy grande (>5 MB)"});
      const mt=IMG_TYPES.includes((f.type||"").toLowerCase())?f.type.toLowerCase():"image/png";
      return readB64(f,d=> d?push({name:f.name,ok:true,kind:"media",media_type:mt,data:d})
                            :push({name:f.name,ok:false,reason:"no se pudo leer"}));
    }
    if(isPdf(f)){
      if(f.size>MAX_PDF) return push({name:f.name,ok:false,reason:"PDF muy grande (>20 MB)"});
      return readB64(f,d=> d?push({name:f.name,ok:true,kind:"media",media_type:"application/pdf",data:d})
                            :push({name:f.name,ok:false,reason:"no se pudo leer"}));
    }
    if(isOffice(f)){
      return push({name:f.name,ok:false,reason:"documento de Office: no se lee como texto"});
    }
    if(isText(f)){
      if(f.size>MAX_TEXT) return push({name:f.name,ok:false,reason:"texto muy grande (>512 KB)"});
      const r=new FileReader();
      r.onload=()=>push({name:f.name,ok:true,kind:"text",text:String(r.result)});
      r.onerror=()=>push({name:f.name,ok:false,reason:"no se pudo leer"});
      return r.readAsText(f);
    }
    push({name:f.name,ok:false,reason:"tipo no soportado"});
  });
}
function clearAtts(){ atts.length=0; renderAtts(); }
function buildMessage(userText){
  let m=userText;
  atts.filter(a=>a.ok&&a.kind==="text").forEach(a=>{
    const ext=(a.name.split(".").pop()||"").toLowerCase();
    const fence=/[a-z0-9]/i.test(ext)&&ext.length<=12?ext:"";
    m += (m?"\n\n":"")+`--- Archivo adjunto: ${a.name} ---\n\`\`\`${fence}\n${a.text}\n\`\`\``;
  });
  return m;
}
function buildAttachments(){
  return atts.filter(a=>a.ok&&a.kind==="media").map(a=>({name:a.name,media_type:a.media_type,data:a.data}));
}

async function api(method, path, body){
  const r = await fetch(path, {method, headers:hdrs(), body: body?JSON.stringify(body):undefined});
  setDot(r.ok);
  const j = await r.json().catch(()=>({error:"respuesta no-JSON"}));
  if(!r.ok) throw new Error(j.error || ("HTTP "+r.status) + (j.detail?" — "+j.detail:""));
  return j;
}

async function refresh(){
  try{
    const j = await api("GET","/sessions");
    const list = $("#list"); list.innerHTML="";
    (j.sessions||[]).forEach(s=>{
      const d=document.createElement("div");
      d.className="sess"+(s.name===state.current?" on":"");
      const perm={full:"⚡autonomía",tools:"🐍python",safe:"👁solo-lectura"}[s.permission]||s.permission||"";
      // "busy" es una palabra que hay que leer; una luz que recorre el nombre se ve sin
      // mirar. Se toma de lo que sabe esta página (un turno en vuelo suyo) Y de lo que
      // reporta el servidor, porque la sesión puede estar trabajando por orden de otra
      // ventana — y ahí es justo donde una señal pasiva vale más.
      const trabajando = !!state.streams[s.name] || s.live_state === "busy";
      if(trabajando) d.classList.add("trabajando");
      // El estado va en su propio elemento para poder callarlo en el acto: mientras el
      // nombre late, la palabra sobra — y tener las dos señales a la vez, una diciendo que
      // trabaja y otra "idle", es peor que no tener ninguna.
      d.innerHTML=`<span class="n">${s.name}</span><span class="s">`
        + `${(s.session_id||"").slice(0,8)}<span class="est"> · ${s.live_state||"idle"}</span>`
        + ` · ${perm}</span>`;
      d.onclick=()=>select(s.name);
      list.appendChild(d);
    });
    if(!(j.sessions||[]).length) list.innerHTML='<div class="empty">Sin sesiones aún.</div>';
  }catch(e){ setDot(false); }
}

// ---- markdown → HTML, autocontenido (sin dependencias) ----
// Regla de oro: ESCAPAR primero. El texto del modelo se pinta como HTML, así que
// cualquier < > & del contenido debe neutralizarse antes de formatear, o es XSS.
function escHtml(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function mdInline(s){                       // s YA viene escapado
  const codes=[];                           // proteger `código` de los demás pasos
  s=s.replace(/`([^`]+)`/g,(m,c)=>{ codes.push(c); return ""+(codes.length-1)+""; });
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[\s(])__(?=\S)([^_]+?)__(?=[\s).,!?;:]|$)/g,"$1<strong>$2</strong>");
  s=s.replace(/(^|[^*])\*(?=\S)([^*]+?)\*/g,"$1<em>$2</em>");
  s=s.replace(/(^|[\s(])_(?=\S)([^_]+?)_(?=[\s).,!?;:]|$)/g,"$1<em>$2</em>");   // evita partir snake_case
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g,(m,txt,url)=>
      '<a href="'+url.replace(/"/g,"%22")+'" target="_blank" rel="noopener noreferrer">'+txt+'</a>');
  return s.replace(/(\d+)/g,(m,i)=>"<code>"+codes[i]+"</code>");
}
function mdToHtml(src){
  const lines=String(src).replace(/\r\n?/g,"\n").split("\n");
  let html="", i=0; const para=[];
  const flush=()=>{ if(para.length){ html+="<p>"+mdInline(escHtml(para.join(" ")))+"</p>"; para.length=0; } };
  const parseRow=r=>r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
  while(i<lines.length){
    const line=lines[i];
    const fence=line.match(/^```(.*)$/);
    if(fence){ flush(); const code=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; } i++;
      html+="<pre><code>"+escHtml(code.join("\n"))+"</code></pre>"; continue; }
    const h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ flush(); const lv=h[1].length; html+="<h"+lv+">"+mdInline(escHtml(h[2].trim()))+"</h"+lv+">"; i++; continue; }
    if(/^\s*$/.test(line)){ flush(); i++; continue; }
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){ flush(); html+="<hr>"; i++; continue; }
    if(/^\s*>\s?/.test(line)){ flush(); const q=[];
      while(i<lines.length && /^\s*>\s?/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,"")); i++; }
      html+="<blockquote>"+mdToHtml(q.join("\n"))+"</blockquote>"; continue; }
    if(line.includes("|") && i+1<lines.length && /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(lines[i+1])){
      flush(); const head=parseRow(line); i+=2; const rows=[];
      while(i<lines.length && lines[i].includes("|") && !/^\s*$/.test(lines[i])){ rows.push(parseRow(lines[i])); i++; }
      html+="<table><thead><tr>"+head.map(c=>"<th>"+mdInline(escHtml(c))+"</th>").join("")+"</tr></thead><tbody>"+
        rows.map(r=>"<tr>"+r.map(c=>"<td>"+mdInline(escHtml(c))+"</td>").join("")+"</tr>").join("")+"</tbody></table>"; continue; }
    if(/^\s*([-*+])\s+/.test(line) || /^\s*\d+\.\s+/.test(line)){ flush();
      const ordered=/^\s*\d+\.\s+/.test(line); const items=[];
      while(i<lines.length && (/^\s*([-*+])\s+/.test(lines[i]) || /^\s*\d+\.\s+/.test(lines[i]))){
        items.push(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/,"")); i++; }
      html+=(ordered?"<ol>":"<ul>")+items.map(it=>"<li>"+mdInline(escHtml(it))+"</li>").join("")+(ordered?"</ol>":"</ul>"); continue; }
    para.push(line.trim()); i++;
  }
  flush(); return html;
}

// botón de copiar reutilizable. getText() devuelve el texto crudo a copiar.
function mkCopy(getText, title){
  const b=document.createElement("button"); b.type="button"; b.className="copy";
  b.textContent="Copiar"; b.title=title||"Copiar";
  b.onclick=async e=>{
    e.stopPropagation();
    const text=getText()||"";
    try{ await navigator.clipboard.writeText(text); }   // 127.0.0.1 es contexto seguro
    catch{                                               // respaldo si no hay Clipboard API
      const ta=document.createElement("textarea"); ta.value=text;
      ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand("copy"); }catch{} ta.remove();
    }
    b.textContent="✓"; b.classList.add("ok");
    setTimeout(()=>{ b.textContent="Copiar"; b.classList.remove("ok"); }, 1000);
  };
  return b;
}

function render(){
  const log=$("#log");
  if(!state.current){ log.innerHTML='<div class="empty">Elige o crea una sesión.</div>'; return; }
  log.innerHTML="";
  tx(state.current).forEach(m=>{
    const d=document.createElement("div");
    d.className="msg "+(m.role==="user"?"user":m.role==="err"?"err":"asst");
    const who=document.createElement("div"); who.className="who";
    who.appendChild(document.createTextNode(m.role==="user"?"tú":m.role==="err"?"error":state.current));
    if(m.role!=="user") who.appendChild(mkCopy(()=>m.text, "Copiar la respuesta"));   // copiar el mensaje entero
    d.appendChild(who);
    if(m.role==="asst"){                     // solo el asistente se renderiza como markdown
      const body=document.createElement("div"); body.className="md";
      body.innerHTML=mdToHtml(m.text||"");
      body.querySelectorAll("pre").forEach(pre=>{        // + copiar cada bloque de código
        const code=pre.querySelector("code");
        pre.appendChild(mkCopy(()=> code?code.textContent:pre.textContent, "Copiar el código"));
      });
      d.appendChild(body);
    } else {                                 // tú y los errores quedan literales (pre-wrap del .msg)
      d.appendChild(document.createTextNode(m.text));
    }
    log.appendChild(d);
  });
  // Una historia traída entera se ve EXACTAMENTE como una nacida aquí — misma etiqueta,
  // mismo render—, y avisar de eso no aporta nada: es la misma conversación. La nota sale
  // solo cuando hubo RECORTE, que es cuando lleva información que el usuario no puede
  // deducir: que lo que ve no es todo.
  const t=state.traido[state.current];
  if(t && t.parcial){
    const n=document.createElement("div"); n.className="hint-traido";
    n.textContent = `Los ${t.mostrados} mensajes más recientes de ${t.total}. `
      + `Lo anterior sigue en el transcript de la sesión.`;
    log.insertBefore(n, log.firstChild);
  }
  const vivo=state.streams[state.current];        // un turno en vuelo de ESTA sesión
  if(vivo && vivo.el) log.appendChild(vivo.el);   // el nodo conserva sus pasos: vuelve entero
  log.scrollTop=log.scrollHeight;
}

// Si ESTE navegador no tiene la conversación, se pide al servidor — que la tiene, porque el
// CLI la escribe en su transcript. Manda el navegador: solo se rellena cuando está vacío, y
// nunca se mezclan dos historias, que es como se fabrica un Frankenstein que nadie audita.
async function traerHistorial(name){
  if(tx(name).length) return;                       // el navegador manda
  try{
    const r=await fetch(`/sessions/${encodeURIComponent(name)}/historial?limite=50`,
                        {headers:hdrs()});
    if(!r.ok) return;
    const d=await r.json();
    if(!d.hay || !d.mensajes || !d.mensajes.length) return;
    localStorage.setItem("tx:"+name, JSON.stringify(d.mensajes));
    state.traido[name]={parcial:!!d.parcial, total:d.total||d.mensajes.length,
                        mostrados:d.mensajes.length};
    if(state.current===name) render();
  }catch{}                                          // sin puente no se inventa nada
}

function select(name){
  state.current=name;
  $("#input").disabled=false; $("#send").disabled=false; $("#attach").disabled=false;
  $("#chathead").style.display="flex"; $("#curname").textContent=name;
  clearAtts(); acClose();
  state.usage[name]=loadUsage(name); renderUsage(name);
  document.querySelectorAll(".sess").forEach(e=>e.classList.toggle("on",e.querySelector(".n").textContent===name));
  render();
  traerHistorial(name);
}

async function closeSession(){
  const name=state.current; if(!name) return;
  // Este aviso decía «se olvida su historial local», y era falso además de feo: cerrar NO
  // borra la conversación — el transcript de la sesión se queda en disco, que es de donde
  // lee la recuperación. Un marco cuyo punto entero es que lo escrito sobrevive no puede
  // despedirse anunciando un olvido.
  //
  // Y la pérdida que SÍ importa no es la conversación: es lo que la sesión hizo y todavía
  // no ha armonizado. Eso solo se puede decir cuando es cierto, así que se mira antes:
  //   · que esa sesión TENGA el ciclo instalado — lo dice el evento `init`, no se supone;
  //   · que el último mensaje no haya sido ya un guardado.
  // Un aviso que sale siempre se lee igual que uno que no sale nunca.
  const hayCiclo = (state.commands||[]).some(c => /^vuelamind-commit$/i.test(c));
  const ultimoMio = [...tx(name)].reverse().find(m => m.role === "user");
  const yaGuardo = !!ultimoMio && /^\/vuelamind-commit\b/i.test((ultimoMio.text||"").trim());
  const aviso = (hayCiclo && !yaGuardo)
    ? `No se armonizarán los cambios hechos desde la última vez que guardaste.\n\n` : "";
  if(!confirm(`¿Cerrar el chat "${name}"?\n\n`
    + aviso
    + `Se detiene su sesión y desaparece de esta página.`)) return;
  $("#close").disabled=true;
  try{
    await api("DELETE","/sessions/"+encodeURIComponent(name));
    localStorage.removeItem("tx:"+name); localStorage.removeItem("usage:"+name);
    delete state.usage[name]; $("#usage").textContent="";
    state.current=null;
    $("#input").disabled=true; $("#send").disabled=true; $("#attach").disabled=true;
    $("#chathead").style.display="none"; clearAtts();
    $("#log").innerHTML='<div class="empty">Sesión cerrada. Elige o crea otra.</div>';
    await refresh();
  }catch(e){ alert("No se pudo cerrar: "+e.message); }
  $("#close").disabled=false;
}
$("#close").onclick=closeSession;

$("#sugLoad").onclick=()=>{            // sugerir y además dejarlo puesto: un clic, no un dictado

$("#create").onclick=async()=>{
  const name=$("#newName").value.trim(), prompt=$("#newPrompt").value.trim();

  // Entramos a la sesión ANTES de que conteste: el primer mensaje suele ser el más caro

  // botón no dice siquiera si sigue vivo. Se ve el turno desde el primer paso.
  const cuerpo={name,prompt,permission}; if(model) cuerpo.model=model;

// ---- panel de progreso en vivo (streaming NDJSON) ----
const TOOL_ICON={Bash:"🔧",Read:"📖",Write:"✍️",Edit:"✏️",NotebookEdit:"✏️",
  WebFetch:"🌐",WebSearch:"🔎",Grep:"🔎",Glob:"🔎",Task:"🤖",Skill:"🧩"};
// La fila se marca EN EL ACTO, no en el refresco: éste corre cada 8 s, y una señal de
// "estoy trabajando" que tarda ocho segundos en aparecer llega tarde justo cuando importa.
// El refresco sigue marcando las sesiones que trabajan por orden de otra ventana.
function marcarTrabajando(name, si){
  document.querySelectorAll(".sess").forEach(e=>{
    const n=e.querySelector(".n");
    if(n && n.textContent===name) e.classList.toggle("trabajando", !!si);
  });
}

function startStream(owner){
  const d=document.createElement("div"); d.className="msg asst stream";
  d.innerHTML=`<div class="who">${owner}</div>`;
  const status=document.createElement("div"); status.className="st-status"; d.appendChild(status);
  const steps=document.createElement("div"); steps.className="st-steps"; d.appendChild(steps);
  const t0=Date.now();
  const p={el:d, status, steps, timer:null, usage:null, owner};
  state.streams[owner]=p;
  marcarTrabajando(owner, true);
  if(owner===state.current){ const log=$("#log"); log.appendChild(d); log.scrollTop=log.scrollHeight; }
  const fmtDur=n=>n<60?n+"s":Math.floor(n/60)+"m "+(n%60)+"s";
  p.upd=()=>{ const n=Math.round((Date.now()-t0)/1000);
    // El consumo vive en la cabecera del chat, y repetirlo aquí no añade nada: dos sitios
    // con el mismo dato solo crean la duda de cuál mirar.
    p.status.textContent="⏳ trabajando… "+fmtDur(n); };
  p.upd(); p.timer=setInterval(p.upd,1000);
  return p;
}
function addStep(p, icon, text){
  const s=document.createElement("div"); s.className="st-step";
  s.textContent=icon+" "+text; p.steps.appendChild(s);
  if(p.owner===state.current) $("#log").scrollTop=$("#log").scrollHeight;
}
function updUsage(ev, owner){
  if(!owner) return;
  const u={context_tokens:ev.context_tokens,output_tokens:ev.output_tokens,window:ev.window,
           provisional:!!ev.provisional};
  state.usage[owner]=u; saveUsage(owner,u); if(owner===state.current) renderUsage(owner);
}
function handleEv(ev, p){
  if(ev.kind==="init"){
    saveCommands(ev.commands, ev.skills);
  } else if(ev.kind==="tool"){
    addStep(p, TOOL_ICON[ev.name]||"🔧", ev.name+(ev.brief?": "+ev.brief:""));
  } else if(ev.kind==="text"){
    const t=ev.text.trim(); if(t) addStep(p, "💬", t.length>240?t.slice(0,240)+"…":t);
  } else if(ev.kind==="usage"){
    updUsage(ev, p&&p.owner);                      // badge persistente en la cabecera
    if(p){ p.usage={context_tokens:ev.context_tokens,output_tokens:ev.output_tokens,
                    window:ev.window,provisional:!!ev.provisional};
           if(p.upd) p.upd(); }                    // + en vivo, al lado del cronómetro
  } else if(ev.kind==="compact"){
    addStep(p, "🗜️", "compactando contexto"+(ev.pre_tokens?" ("+fmtTok(ev.pre_tokens)+" tok)":"")+"…");
  } else if(ev.kind==="error"){
    addStep(p, "⚠️", (ev.error||"error").slice(0,240));
  }
}
function endStream(p){
  if(!p) return;
  if(p.timer) clearInterval(p.timer);
  if(p.el) p.el.remove();
  if(p.owner && state.streams[p.owner]===p) delete state.streams[p.owner];
  if(p.owner) marcarTrabajando(p.owner, false);
}

// ---- recuperar un turno cuyo stream se rompió ----
// El servidor sigue el turno aunque el navegador se caiga, y el CLI lo escribe en su
// transcript. Así que un corte de conexión ya no es "se perdió la respuesta": es "hay que
// ir a buscarla". Lo que NO se hace es enseñar la respuesta anterior como si fuera ésta —
// por eso se mira `terminado`, y no solo si hay texto.
async function recuperar(owner, panel){
  const url="/sessions/"+encodeURIComponent(owner)+"/ultimo";
  for(let intento=0; intento<60; intento++){
    let d;
    try{ const r=await fetch(url,{headers:hdrs()}); if(!r.ok) throw 0; d=await r.json(); }
    catch{ return {estado:"sin-puente"}; }
    if(d.terminado && d.hay) return {estado:"recuperado", texto:d.texto};
    if(!d.en_vuelo) return {estado:d.terminado ? "vacio" : "muerto"};
    if(panel && panel.status) panel.status.textContent =
      "⏳ se cortó la conexión, pero el turno sigue — esperando su respuesta… " + ((intento+1)*2) + "s";
    await new Promise(r=>setTimeout(r,2000));
  }
  return {estado:"tarda"};
}

// ---- el motor de un turno en vivo, compartido por «enviar» y por «crear» ----
// Crear era el unico camino que no pasaba por aqui: bloqueaba hasta el final, sin un solo
// evento, y era ademas el ultimo turno que seguia muriendo con el cliente.
async function correrTurno(url, body, owner){
  const panel=startStream(owner);
  let finalText="", isErr=false;
  try{
    const r=await fetch(url,{method:"POST", headers:hdrs(), body:JSON.stringify(body)});
    setDot(r.ok);
    if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error||("HTTP "+r.status)); }
    const reader=r.body.getReader(), dec=new TextDecoder(); let buf="";
    for(;;){
      const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
        if(!line) continue;
        let ev; try{ ev=JSON.parse(line); }catch{ continue; }
        handleEv(ev, panel);
        if(ev.kind==="result"){ finalText=ev.text||""; isErr=!!ev.is_error; }
        if(ev.kind==="error"){ isErr=true; if(!finalText) finalText=ev.error||"error"; }
      }
    }
    endStream(panel);
    pushTx(owner, isErr?"err":"asst", finalText || (isErr?"(error)":""));
    // Reconciliar la lista AHORA: al terminar, esta página deja de marcar la fila pero el
    // servidor puede seguir reportando `busy` unos segundos, y el refresco periódico la
    // volvería a encender. Un parpadeo pequeño, pero es una señal diciendo dos cosas.
    refresh();
    return !isErr;
  }catch(e){
    setDot(false);
    // NO escribir el error del transporte donde va el contenido: mañana parecería que el
    // asistente contestó "network error". Primero se va a buscar la respuesta.
    const r=await recuperar(owner, panel);
    endStream(panel);
    if(r.estado==="recuperado") pushTx(owner,"asst",r.texto);
    else if(r.estado==="muerto") pushTx(owner,"err",
      "Se cortó la conexión ("+e.message+") y el turno no llegó a terminar. No hay respuesta que recuperar: hay que repetir el mensaje.");
    else if(r.estado==="tarda") pushTx(owner,"err",
      "Se cortó la conexión ("+e.message+"). El turno seguía corriendo tras dos minutos de espera; su respuesta quedará en la sesión y se puede recuperar recargando.");
    else if(r.estado==="vacio") pushTx(owner,"err",
      "Se cortó la conexión ("+e.message+"). El turno terminó sin texto, solo con herramientas.");
    else pushTx(owner,"err","Se cortó la conexión ("+e.message+") y tampoco alcanzo al puente para recuperar el turno.");
    return false;
  }
}

async function send(){
  const t=$("#input").value.trim();
  const okAtts=atts.filter(a=>a.ok);
  if((!t && !okAtts.length) || !state.current) return;
  const message=buildMessage(t);
  const attachments=buildAttachments();
  const shown = t + (okAtts.length ? (t?"\n":"")+"📎 "+okAtts.map(a=>a.name).join(", ") : "");
  // EL DUEÑO DEL TURNO SE CAPTURA AQUÍ Y NO SE VUELVE A PREGUNTAR.
  // Antes todo esto leía state.current en vivo: si cambiabas de sesión mientras el turno
  // corría, la respuesta se guardaba en el historial de la sesión que estuvieras mirando
  // al terminar — se perdía de la suya y ensuciaba la otra, sin que nada fallara.
  const owner=state.current;
  $("#input").value=""; clearAtts(); $("#send").disabled=true;
  pushTx(owner,"user",shown); render();
  const cuerpo={message}; if(attachments.length) cuerpo.attachments=attachments;
  await correrTurno(`/sessions/${encodeURIComponent(owner)}/stream`, cuerpo, owner);
  render(); $("#send").disabled=false; $("#input").focus();
}
$("#send").onclick=send;

// ---- autocompletar "/": se dispara cuando el mensaje es un único token que empieza por "/" ----
const AC={open:false,items:[],sel:0};
function acQuery(){
  const v=$("#input").value;
  const m=/^\/([a-zA-Z0-9._:-]*)$/.exec(v);   // sólo el primer token, sin espacios aún
  return (m && state.commands.length) ? m[1].toLowerCase() : null;
}
function acRender(){
  const q=acQuery(), box=$("#ac");
  if(q===null){ acClose(); return; }
  const skills=new Set(state.skills||[]);
  const items=state.commands
    .filter(c=>c.toLowerCase().includes(q))
    .sort((a,b)=>((a.toLowerCase().startsWith(q)?0:1)-(b.toLowerCase().startsWith(q)?0:1))
                 || a.localeCompare(b))
    .slice(0,60);
  if(!items.length){ acClose(); return; }
  AC.open=true; AC.items=items; if(AC.sel>=items.length) AC.sel=0;
  box.innerHTML="";
  items.forEach((c,i)=>{
    const d=document.createElement("div"); d.className="it"+(i===AC.sel?" sel":"");
    d.innerHTML='<span>/'+c+'</span>'+(skills.has(c)?'<span class="tag">skill</span>':'');
    d.onmousedown=e=>{ e.preventDefault(); acPick(i); };
    box.appendChild(d);
  });
  box.hidden=false;
  const sel=box.querySelector(".it.sel"); if(sel) sel.scrollIntoView({block:"nearest"});
}
function acClose(){ AC.open=false; AC.sel=0; const b=$("#ac"); if(b){ b.hidden=true; b.innerHTML=""; } }
function acPick(i){ const c=AC.items[i]; if(!c) return; $("#input").value="/"+c+" "; acClose(); $("#input").focus(); }

$("#input").addEventListener("input",acRender);
$("#input").addEventListener("blur",()=>setTimeout(acClose,120));
$("#input").addEventListener("keydown",e=>{
  if(AC.open){
    if(e.key==="ArrowDown"){ e.preventDefault(); AC.sel=(AC.sel+1)%AC.items.length; acRender(); return; }
    if(e.key==="ArrowUp"){   e.preventDefault(); AC.sel=(AC.sel-1+AC.items.length)%AC.items.length; acRender(); return; }
    if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); acPick(AC.sel); return; }
    if(e.key==="Escape"){ e.preventDefault(); acClose(); return; }
  }
  if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); }
});

// adjuntar: botón + selector de archivos
$("#attach").onclick=()=>$("#file").click();
$("#file").addEventListener("change",e=>{ if(e.target.files.length) addFiles(e.target.files); e.target.value=""; });

// pegar: si el portapapeles trae archivos (p. ej. captura), se adjuntan
$("#input").addEventListener("paste",e=>{
  const f=e.clipboardData&&e.clipboardData.files;
  if(f&&f.length){ e.preventDefault(); addFiles(f); }
});

// arrastrar y soltar sobre el chat
const logEl=$("#log");
["dragenter","dragover"].forEach(ev=>logEl.addEventListener(ev,e=>{
  if(!state.current) return; e.preventDefault(); logEl.classList.add("drop");
}));
["dragleave","drop"].forEach(ev=>logEl.addEventListener(ev,e=>{
  e.preventDefault(); logEl.classList.remove("drop");
}));
logEl.addEventListener("drop",e=>{
  if(state.current && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

refresh(); setInterval(refresh, 8000);
</script>
