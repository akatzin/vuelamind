# vuelamind en contenedor — LA VERSION DE UN SOLO ARCHIVO.
#
# Esto es todo lo que hace falta en tu disco. No se clona el repositorio: Docker
# construye tomando como contexto SOLO la carpeta `docker/` del canon.
#
#   curl -fsSL -O https://raw.githubusercontent.com/akatzin/vuelamind/main/docker/compose.remoto.yml
#   mkdir -p trabajo
#   docker compose -f compose.remoto.yml up -d --build
#   docker compose -f compose.remoto.yml exec vuelamind claude     # una vez: /login
#   y abre http://127.0.0.1:8850
#
# EL `mkdir` NO SOBRA EN LINUX: si la carpeta no existe la crea Docker, y la crea como
# root; dentro se corre como uid 1000. Quien clona el repositorio no lo necesita —ahi
# la carpeta viaja hecha—, pero aqui no hay repositorio que la traiga.
#
# Para actualizar a lo ultimo del canon:  docker compose -f compose.remoto.yml build
# (la referencia de la rama se comprueba en cada build; si el canon no avanzo, reusa cache)
#

services:
  vuelamind:
    build:
      # EL CONTEXTO ES REMOTO: Docker toma SOLO la carpeta docker/ de este repositorio.
      # Quien use este archivo no necesita clonar nada — el clon completo son 55 MB
      # (19 solo de audio del sitio) y esta carpeta son 44 KB.
      context: https://github.com/akatzin/vuelamind.git#main:docker
      args:
        VUELAMIND_REF: main
        # El SDK de gcloud, ~1 GB. Hace falta SOLO si autenticas contra Vertex
        # (Model Garden). Si usas el login por cuenta de Claude, pon "0" y la
        # imagen baja de ~2.2 GB a ~1.2 GB.
        CON_GCLOUD: "1"
    image: vuelamind:horneado
    command: vuelamind-puente

    ports:
      # ANFITRION 127.0.0.1:8850  ->  CONTENEDOR 8851 (relevo)  ->  8850 (puente).
      #
      # El "127.0.0.1:" del lado izquierdo NO es decorativo y no se quita: es el
      # unico limite real. Sin el, Docker publica en todas las interfaces y el
      # puente queda alcanzable desde la red — y el puente NO tiene token, y su
      # nivel de permiso por omision ejecuta lo que le pidan. Quien lo abra a la
      # red esta tomando una decision que el marco no toma por el.
      #
      # Los dos numeros de la izquierda tienen que ser el PORT de abajo: el puente
      # valida Origin con puerto incluido. Cambiar uno sin el otro deja la pagina
      # cargando y toda creacion de sesion en 403.
      - "127.0.0.1:8850:8851"

    environment:
      PORT: "8850"
      VUELAMIND_RELEVO: "8851"
      BRIDGE_CWD: /trabajo
      # `full` = bypassPermissions. En la maquina de uno eso es la razon de mas
      # peso para no exponer el puente; AQUI el alcance es el contenedor y el
      # /trabajo montado, que es justamente para lo que existe esta imagen: una
      # entrevista headless no tiene quien apruebe permisos en vivo, y sin esto
      # el dominio no puede nacer porque no puede escribir su vault.
      BRIDGE_PERMISSION: full
      # Donde vive el master del marco DENTRO del contenedor. Con esto, la pagina
      # ofrece nacer un dominio con un clic, en el idioma que tenga puesto. Si la
      # ruta no existe, el puente lo dice al arrancar y el boton no aparece: no hay
      # forma de que ofrezca algo que no esta.
      BRIDGE_MASTER: /opt/vuelamind/MARCO_Inicial.md

    # Vertex / Model Garden: se configura en `vertex.env`, que NO es YAML — una
    # clave, un igual, un valor. Editar este archivo a mano para poner un
    # proyecto es pedir un error de indentacion, y llega disfrazado de
    # "go-yaml load error in parser", que no dice que lo rompio fue el editor.
    # `required: false` porque este archivo es OPCIONAL: quien se autentica con su
    # cuenta de Claude no lo necesita, y sin esta linea borrarlo rompe el arranque.
    env_file:
      - path: vertex.env
        required: false

    volumes:
      # El dominio que nace. Es tuyo y vive fuera del contenedor a proposito:
      # un vault que muere con `docker rm` no es un vault.
      #
      # LA CARPETA VIAJA CON EL CANON, vacia y con su .gitignore, para que Docker no
      # tenga que crearla: en Linux la crearia como ROOT y dentro se corre como uid
      # 1000 — un clon nuevo no levantaba (medido en Debian con Engine 29.5.2). Si la
      # borras, vuelve el caso: el puente se niega a arrancar y dice como arreglarlo.
      #
      # Y esta DENTRO del clon del canon por comodidad del primer arranque, no porque
      # sea el mejor sitio. Para trabajar en serio, sacala fuera y cambia esta ruta:
      # `git clean -fdx` sobre el clon se lleva todo lo ignorado, y aqui todo lo es.
      - ./trabajo:/trabajo
      # El hogar del usuario `node`: login del CLI, registro de sesiones del puente,
      # config y los transcripts de las conversaciones. Volumen nombrado para no
      # repetir el login cada vez.
      #
      # Es DESECHABLE a proposito, y eso decide como se muda uno de maquina: lo que
      # vale se escribe en el vault -para eso existe el cierre- y el agente se retoma
      # con /vuelamind-load leyendo su propia carpeta. Mudarse es copiar ./trabajo y
      # volver a entrar; lo unico que se queda es el historial de chat, que es
      # material crudo ya destilado. El login no viaja, y eso es deliberado.
      - vuelamind-hogar:/home/node

    stop_grace_period: 10s

volumes:
  vuelamind-hogar:
